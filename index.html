<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TraDemon 매매일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dela+Gothic+One&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an exchange order ticket on the left, the trade ledger on the right; a contract page stands in front of both on every visit. */
:root{
  color-scheme: dark;
  --bg:#0a0910;
  --panel:#13111b;
  --panel-2:#1b1826;
  --line:#272335;
  --line-2:#38334c;
  --fg:#eeebf6;
  --muted:#8f89a5;
  --dim:#5f5a74;
  --long:#fff59d;
  --long-ink:#1d1a00;
  --short:#7e57c2;
  --short-text:#b39ae6;
  --short-ink:#ffffff;
  --blood:#ff3d5e;
  --blood-dark:#b0102c;
  --gash-top:#3d0012;
  --gash-bottom:#0b0004;
  --font-display:"Black Han Sans","Dela Gothic One","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--long)}
:focus-visible{outline:2px solid var(--long);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.status{display:flex;align-items:center;gap:14px}
.status .seed{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.status .seed small{color:var(--muted);font-size:11px}
.status .seed strong{font-family:var(--font-num);font-size:15px;font-weight:600}
.marks{display:inline-flex;gap:2px;font-family:var(--font-display);font-size:24px;line-height:1}
.marks.big{font-size:clamp(72px,18vw,128px);gap:.08em}
.six{position:relative;display:inline-block;color:var(--fg)}
.six.cut{color:var(--dim)}
.six .gash{position:absolute;left:-20%;top:-6%;width:140%;height:128%;overflow:visible;pointer-events:none}
.gash-cut{fill:url(#gashFill);stroke:var(--blood);stroke-width:1.2;stroke-linejoin:miter;filter:drop-shadow(0 0 1.5px var(--blood))}
.gash .drip{stroke:var(--blood-dark);stroke-linecap:round;fill:none}
.gash .drip.d1{stroke-width:3}.gash .drip.d2{stroke-width:4}.gash .drip.d3{stroke-width:2.6}
.gash .drop{fill:var(--blood-dark);transform-box:fill-box;transform-origin:center;animation:fall 3.2s ease-in infinite}
.gash .drop.d2{animation-delay:1.1s}.gash .drop.d3{animation-delay:2.2s}
@keyframes fall{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(26px) scale(.8);opacity:0}}
.six.fresh .gash{animation:rip .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes rip{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.six.fresh .gash .drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 1.3s ease-in .45s both}
@keyframes drip{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.six.fresh .gash .drop{animation-delay:1.8s}
.icon-btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;height:34px;padding:0 12px;cursor:pointer;color:var(--fg)}
.icon-btn:hover{border-color:var(--muted)}
@media (max-width:520px){.brand span{display:none}.status .seed small{display:none}.top .wrap{gap:10px}.marks{font-size:20px}}

/* shared bits */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:12px;color:var(--muted)}
.input{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;height:42px;padding:0 12px;width:100%;min-width:0}
textarea.input{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--long);outline:none}
.input.num{font-size:15px}
.suffix{position:relative}
.suffix .input{padding-right:52px}
.suffix em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:12px;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:44px;border-radius:8px;border:0;padding:0 16px;font-weight:700;cursor:pointer;transition:filter .15s,opacity .15s}
.btn:disabled{opacity:.28;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.btn.long{background:var(--long);color:var(--long-ink)}
.btn.short{background:var(--short);color:var(--short-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--fg)}
.btn.danger{background:var(--blood);color:var(--short-ink)}
.btn.small{height:34px;font-size:13px;padding:0 12px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.03em}
.chip.long{background:var(--long);color:var(--long-ink)}
.chip.short{background:var(--short);color:var(--short-ink)}
.chip.cut{background:transparent;border:1px solid var(--blood);color:var(--blood)}
.chip.demo{background:transparent;border:1px solid var(--muted);color:var(--muted)}
.up{color:var(--long)}
.down{color:var(--short-text)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.warn{color:var(--blood)}
.banner{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--radius);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.alert{border-color:var(--blood)}
.linkbtn{background:none;border:0;padding:0;color:var(--long);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* gate */
#gate .wrap{padding-block:40px 64px;display:grid;place-items:center}
.contract{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px clamp(18px,5vw,40px);display:flex;flex-direction:column;gap:20px}
.contract h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,7vw,48px);line-height:1.1;margin:0;text-wrap:balance}
.clause{font-size:16px;line-height:1.75;margin:0}
.clause b{color:var(--long);font-family:var(--font-num)}
.whisper{border-left:2px solid var(--short);padding-left:12px;color:var(--short-text);font-size:14px;margin:0}
.marks-wrap{display:flex;justify-content:center;padding-block:4px}
.terms{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--long)}
.slider-row output{font-family:var(--font-num);font-size:18px;font-weight:600;min-width:52px;text-align:right;color:var(--long)}
.ticks{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:11px;color:var(--dim);padding-inline:2px}
.locked{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.locked strong{color:var(--fg);font-family:var(--font-num)}
.sign{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.sign input{width:20px;height:20px;accent-color:var(--long)}
.gate-actions{display:flex;flex-direction:column;gap:12px}

/* journal */
#journal .wrap{padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:920px){.grid{grid-template-columns:360px minmax(0,1fr)}.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.ticket{padding:18px;display:flex;flex-direction:column;gap:14px}
.ticket h2,.section-head h2{font-size:15px;margin:0;font-weight:700}
.calc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.calc div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.calc dt{color:var(--muted)}
.calc dd{margin:0;font-family:var(--font-num);text-align:right}
.calc .alert{color:var(--blood);font-size:12.5px;line-height:1.5;display:block}
.dir-hint{font-size:12px;color:var(--muted);text-align:center;min-height:18px}
.trade-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ledger{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
@media (min-width:640px){.stats{grid-template-columns:repeat(5,minmax(0,1fr)) minmax(140px,1.4fr)}}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{color:var(--muted);font-size:11.5px}
.stat strong{font-family:var(--font-num);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{grid-column:1/-1;min-width:0}
@media (min-width:640px){.spark{grid-column:auto}}
.spark svg{width:100%;height:48px;display:block}
.section{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;height:32px;padding:0 10px}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line-2);border-radius:8px;text-align:center}

.pos{border:1px solid var(--line-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.pos-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos-head strong{font-size:15px}
.pos-head time{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--font-num)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (min-width:560px){.kv{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv small{color:var(--muted);font-size:11px}
.kv span{font-family:var(--font-num);font-size:13px;overflow-wrap:anywhere}
.close-row{display:flex;gap:8px;flex-wrap:wrap}
.close-row .input{flex:1 1 160px;height:38px}
.confirm{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.confirm.bad{border-color:var(--blood)}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}

.hist{display:flex;flex-direction:column;gap:8px}
.hist details{border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.hist details[open]{border-color:var(--line-2)}
.hist details.cutrow{border-left:3px solid var(--blood)}
.hist summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.h-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.h-main strong{font-size:14px}
.h-main time{color:var(--muted);font-size:12px;font-family:var(--font-num)}
.h-prices{grid-column:1/2;font-family:var(--font-num);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.h-pnl{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--font-num);display:flex;flex-direction:column;align-items:flex-end}
.h-pnl strong{font-size:15px}
.h-pnl small{font-size:12px}
.h-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.snaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.snap{display:flex;flex-direction:column;gap:6px;min-width:0}
.snap img{width:100%;border-radius:6px;border:1px solid var(--line);display:block;background:var(--bg)}
.snap a{font-size:12px;overflow-wrap:anywhere}

/* sheet + overlay */
.scrim{position:fixed;inset:0;background:rgba(5,4,9,.72);z-index:40;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:18px}
.sheet h3{margin:0;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:17px}
.sheet section{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.guide{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--fg)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,9,.86);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.verdict{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--blood);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.verdict h2{font-family:var(--font-display);font-weight:400;font-size:40px;margin:0;color:var(--blood)}
.verdict p{margin:0}
.verdict .summary{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;background:var(--bg);border-radius:8px;padding:12px}
.verdict .summary small{color:var(--muted);font-size:11px;display:block}
.verdict .summary span{font-family:var(--font-num)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
.gear{width:36px;height:36px;padding:0;display:grid;place-items:center}
.gear svg{width:18px;height:18px}
.lang-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lang-seg button{height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-weight:500}
.lang-seg button[aria-pressed="true"]{background:var(--long);color:var(--long-ink);border-color:var(--long)}
@media (prefers-reduced-motion:reduce){.gash,.gash *{animation:none!important}*{transition:none!important}}
</style>


<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="gashFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--gash-top)"/><stop offset="1" style="stop-color:var(--gash-bottom)"/></linearGradient></defs></svg>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="var(--panel-2)" stroke="var(--long)" stroke-width="2.5"/>
        <path d="M17 11 C 10 20, 13 31, 25 30 C 19 26, 17 19, 17 11 Z" fill="var(--long)"/>
        <path d="M47 11 C 54 20, 51 31, 39 30 C 45 26, 47 19, 47 11 Z" fill="var(--short)"/>
        <path d="M15 36 Q 32 55 49 36 Q 32 44 15 36 Z" fill="var(--fg)"/>
        <path d="M17 37.5 L21 43 L25 40 L29 46 L32 41.5 L35 46 L39 40 L43 43 L47 37.5" fill="none" stroke="var(--panel-2)" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
      <div><b>TraDemon</b> <span data-i18n="brandSub">매매일지</span></div>
    </div>
    <div class="status" id="top-status"></div>
    <button class="icon-btn gear" id="open-settings" type="button" data-i18n-aria="settingsBtn" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main>
  <section id="gate" aria-labelledby="gate-title">
    <div class="wrap"><div class="contract" id="contract"></div></div>
  </section>

  <section id="journal" hidden>
    <div class="wrap">
      <div id="journal-banners" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="grid">
        <form class="panel ticket" id="ticket" novalidate>
          <h2 data-i18n="newTrade">새 매매</h2>
          <div class="row2">
            <div class="field"><label for="t-date" data-i18n="date">매매 일자</label><input class="input num" id="t-date" type="datetime-local"></div>
            <div class="field"><label for="t-symbol" data-i18n="symbol">코인 종목</label><input class="input" id="t-symbol" list="symbols" value="BTCUSDT" autocomplete="off"></div>
          </div>
          <datalist id="symbols"><option value="BTCUSDT"><option value="ETHUSDT"><option value="SOLUSDT"><option value="XRPUSDT"><option value="DOGEUSDT"></datalist>
          <div class="row2">
            <div class="field"><label for="t-entry" data-i18n="entry">진입가</label><input class="input num" id="t-entry" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00"></div>
            <div class="field"><label for="t-stop" data-i18n="stop">손절가</label><input class="input num" id="t-stop" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00"></div>
          </div>
          <div class="field"><label for="t-lev" data-i18n="lev">레버리지 (선택)</label><div class="suffix"><input class="input num" id="t-lev" type="number" inputmode="numeric" step="1" min="1" max="200" data-i18n-ph="levPh"><em>x</em></div></div>
          <dl class="calc" id="t-calc"></dl>
          <div class="field"><label for="t-snap" data-i18n="snap">진입 스냅샷 링크</label><input class="input" id="t-snap" type="url" inputmode="url" placeholder="https://www.tradingview.com/x/…"><button type="button" class="linkbtn note" data-action="guide" style="align-self:flex-start" data-i18n="snapHow">스냅샷 링크 받는 법</button></div>
          <div class="field"><label for="t-note" data-i18n="note">비고</label><textarea class="input" id="t-note" data-i18n-ph="notePh"></textarea></div>
          <div class="dir-hint" id="t-hint"></div>
          <div class="trade-btns">
            <button class="btn long" type="button" id="rec-long" disabled data-i18n="recLong">Long 기록</button>
            <button class="btn short" type="button" id="rec-short" disabled data-i18n="recShort">Short 기록</button>
          </div>
        </form>

        <div class="ledger">

    if (!isFinite(x)) return '—';

    if (signed) return (x > 0 ? '+' : x < 0 ? '−' : '') + '$' + s;

  }

  function sizing(seed, riskPct, entry, stop, lev){
    var out = { ok:false };
    if (!(entry > 0) || !(stop > 0) || entry === stop || !(seed > 0)) return out;
    out.ok = true;
    out.dir = stop < entry ? 'long' : 'short';
    out.entry = entry; out.stop = stop;
    out.riskAmt = seed * riskPct / 100;
    out.dist = Math.abs(entry - stop);
    out.distPct = out.dist / entry * 100;
    out.qty = out.riskAmt / out.dist;
    out.notional = out.qty * entry;
    out.maxLev = Math.floor(1 / (out.distPct / 100 + MMR));
    if (lev > 0) {
      out.lev = lev;
      out.margin = out.notional / lev;
      out.liq = out.dir === 'long' ? entry * (1 - 1 / lev + MMR) : entry * (1 + 1 / lev - MMR);
      out.liqFirst = out.dir === 'long' ? out.liq >= stop : out.liq <= stop;
      out.marginOver = out.margin > seed;
    }
    return out;
  }

  function closeCalc(t, exit, feePct, threshold){
    var sign = t.dir === 'long' ? 1 : -1;
    var gross = t.qty * (exit - t.entry) * sign;
    var fee = (t.entry + exit) * t.qty * feePct / 100;
    var pnl = gross - fee;
    return { pnl: pnl, fee: fee, pct: pnl / t.seedAtEntry * 100, r: pnl / t.riskAmt, violation: pnl < 0 && -pnl >= t.seedAtEntry * threshold / 100 };
  }

  function renderStats(){
    var c = active(); if (!c) return;
    var closed = tradesOf(c).filter(function(t){ return t.status === 'closed'; });
    var seed = seedOf(c);

    var avgR = closed.length ? closed.reduce(function(a, t){ return a + t.r; }, 0) / closed.length : NaN;
    var ret = (seed - c.startSeed) / c.startSeed * 100;
    var h = '';
    h += stat(T('sSeed'), usd(seed), cls(seed - c.startSeed));
    h += stat(T('sRet'), pct(ret, true), cls(ret));
    h += stat(T('sTrades'), T('sTradesV', { n: closed.length }), '');

  function stat(label, val, k){ return '<div class="stat"><small>' + label + '</small><strong class="' + k + '">' + val + '</strong></div>'; }
  function spark(c, closed){
    var pts = [c.startSeed], run = c.startSeed;
    closed.slice().sort(function(a, b){ return (a.closedAt || '').localeCompare(b.closedAt || ''); }).forEach(function(t){ run += t.pnl; pts.push(run); });
    var W = 200, H = 48, pad = 4;
    if (pts.length < 2) return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><line x1="0" y1="' + H/2 + '" x2="' + W + '" y2="' + H/2 + '" stroke="var(--line-2)" stroke-dasharray="3 4"/></svg><small class="note">' + T('sparkEmpty') + '</small>';
    var min = Math.min.apply(null, pts.concat([c.startSeed])), max = Math.max.apply(null, pts.concat([c.startSeed]));
    if (max === min) { max += 1; min -= 1; }
    var x = function(i){ return pad + i * (W - pad * 2) / (pts.length - 1); };
    var y = function(v){ return pad + (max - v) * (H - pad * 2) / (max - min); };
    var line = pts.map(function(v, i){ return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    var col = last >= c.startSeed ? 'var(--long)' : 'var(--short-text)';
    var area = 'M' + x(0) + ',' + (H - pad) + ' L' + line.split(' ').join(' L') + ' L' + x(pts.length - 1) + ',' + (H - pad) + ' Z';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' +
      '<line x1="0" x2="' + W + '" y1="' + y(c.startSeed).toFixed(1) + '" y2="' + y(c.startSeed).toFixed(1) + '" stroke="var(--line-2)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>' +
      '<path d="' + area + '" fill="' + col + '" fill-opacity=".12"/>' +
      '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(last).toFixed(1) + '" r="2.6" fill="' + col + '"/></svg>';
  }

  function renderCalc(){
    var c = active(); if (!c) return;
    var seed = seedOf(c);
    var s = sizing(seed, S().settings.riskPct, n($('t-entry').value), n($('t-stop').value), n($('t-lev').value));
    var b = base($('t-symbol').value);
    var h = '';
    h += row(T('cRisk'), S().settings.riskPct + '% · ' + usd(seed * S().settings.riskPct / 100));
    if (s.ok) {
      h += row(T('cDist'), pct(s.distPct));
      h += row(T('cQty'), qty(s.qty) + ' ' + esc(b));
      h += row(T('cNotional'), usd(s.notional));
      h += row(T('cFee'), (s.ok ? T('cFeeV', { r: S().settings.feePct, v: usd((s.entry + s.stop) * s.qty * S().settings.feePct / 100) }) : S().settings.feePct + '%') + ' <button class="linkbtn" type="button" data-action="guide">' + T('cFeeEdit') + '</button>');
      h += row(T('cMaxLev'), T('cMaxLevV', { n: s.maxLev }));
      if (s.lev) {
        h += row(T('cMargin'), usd(s.margin));
        h += row(T('cLiq'), price(s.liq));
        if (s.liqFirst) h += '<span class="alert">' + T('aLiqFirst', { n: s.maxLev }) + '</span>';
        if (s.marginOver) h += '<span class="alert">' + T('aMargin') + '</span>';
      }
    } else {
      h += row(T('cQty'), T('cQtyEmpty'));
      h += row(T('cFee'), (s.ok ? T('cFeeV', { r: S().settings.feePct, v: usd((s.entry + s.stop) * s.qty * S().settings.feePct / 100) }) : S().settings.feePct + '%') + ' <button class="linkbtn" type="button" data-action="guide">' + T('cFeeEdit') + '</button>');
    }
    if (!(seed > 0)) h += '<span class="alert">' + T('aSeedZero') + '</span>';
    $('t-calc').innerHTML = h;
    $('rec-long').disabled = !(s.ok && s.dir === 'long');
    $('rec-short').disabled = !(s.ok && s.dir === 'short');
    $('t-hint').textContent = s.ok ? (s.dir === 'long' ? T('hintLong') : T('hintShort')) : T('hintDefault');
  }
  function row(k, v){ return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }

  function recordEntry(dir){
    var c = active(); if (!c) return;
    var seed = seedOf(c);
    var entry = n($('t-entry').value), stop = n($('t-stop').value), lev = n($('t-lev').value);
    var s = sizing(seed, S().settings.riskPct, entry, stop, lev);
    if (!s.ok || s.dir !== dir) return;
    S().trades.push({
      id: S().nextId++, contractId: c.id,
      date: $('t-date').value || nowLocal(),
      symbol: ($('t-symbol').value || 'BTCUSDT').toUpperCase().trim(),
      dir: dir, entry: entry, stop: stop, lev: lev > 0 ? lev : null,
      qty: s.qty, riskAmt: s.riskAmt, riskPct: S().settings.riskPct, seedAtEntry: seed, threshold: c.threshold,
      entrySnap: $('t-snap').value.trim(), note: $('t-note').value.trim(),
      status: 'open'
    });
    save();
    $('t-entry').value = ''; $('t-stop').value = ''; $('t-snap').value = ''; $('t-note').value = '';
    $('t-date').value = nowLocal();
    toast(dir === 'long' ? T('tLong') : T('tShort'));
    renderJournal();
  }

      h += '<div class="kv"><div><small>' + T('entry') + '</small><span>' + price(t.entry) + '</span></div><div><small>' + T('stop') + '</small><span>' + price(t.stop) + '</span></div><div><small>' + T('cQty') + '</small><span>' + qty(t.qty) + ' ' + esc(base(t.symbol)) + '</span></div><div><small>' + T('cRisk') + '</small><span>' + usd(t.riskAmt) + '</span></div></div>';
      if (t.note) h += '<div class="note">' + esc(t.note) + '</div>';

      if (pc != null) {

        var r = closeCalc(t, pc, S().settings.feePct, tth);
        h += '<div class="confirm' + (r.violation ? ' bad' : '') + '"><div><span class="num">' + T('exitAt') + ' ' + price(pc) + ' → </span><strong class="num ' + cls(r.pnl) + '">' + usd(r.pnl, true) + ' (' + pct(r.pct, true) + ') · ' + rr(r.r) + '</strong></div>';

      } else if (pendingCancel[t.id]) {

      }

      h += '<div class="h-pnl"><strong class="' + cls(t.pnl) + '">' + usd(t.pnl, true) + '</strong><small class="' + cls(t.pnl) + '">' + pct(t.pct, true) + ' · ' + rr(t.r) + '</small></div>';
      h += '<div class="h-prices">' + price(t.entry) + ' → ' + price(t.exit) + ' · ' + T('stopWord') + ' ' + price(t.stop) + '</div>';

  function snapBlock(label, url){
    var u = safeUrl(url);
    if (!u) return '<div class="snap"><div class="note">' + T('snapNone', { l: label }) + '</div></div>';
    var img = snapImage(u);
    return '<div class="snap"><div class="note">' + T('snapLabel', { l: label }) + '</div>' + (img ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(img) + '" alt="' + esc(T('snapAlt', { l: label })) + '" loading="lazy"></a>' : '') + '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a></div>';
  }

  function renderJournal(){
    renderTop(); renderBanners(); renderStats(); renderCalc(); renderOpen(); renderHistory();
  }

  // ---------- closing + verdicts ----------
  function confirmClose(id){
    var c = active(); var t = S().trades.find(function(x){ return x.id === id; });
    var exit = pendingClose[id];
    if (!c || !t || exit == null) return;
    var tth = t.threshold || c.threshold;
    var r = closeCalc(t, exit, S().settings.feePct, tth);
    t.status = 'closed'; t.exit = exit; t.closedAt = new Date().toISOString();
    t.pnl = r.pnl; t.fee = r.fee; t.pct = r.pct; t.r = r.r; t.violation = r.violation;
    t.review = t.review || ''; t.exitSnap = t.exitSnap || '';
    delete pendingClose[id];
    if (r.violation) {
      var cuts = cutsOf(c);
      freshCut = cuts - 1;
      queue.push({ kind:'cut', trade:t, cuts:cuts, threshold:tth });
      if (cuts >= 3) {
        c.endedAt = new Date().toISOString(); c.broken = true;
        queue.push({ kind:'broken', contract:c });
      }
    }
    save();
    renderJournal();
    toast(T('tClosed'));
    nextVerdict();
  }

  function nextVerdict(){
    var v = queue.shift();
    if (!v) { $('overlay').hidden = true; freshCut = null; return; }
    var h = '';
    if (v.kind === 'cut') {
      h += marksHTML(v.cuts, true);
      h += '<h2>' + T('vLifeTitle') + '</h2>';
      h += '<p class="num">' + T('vLifeLine', { p: pct(v.trade.pct, true), th: v.threshold, n: Math.max(0, 3 - v.cuts) }) + '</p>';
      h += '<p class="whisper" style="text-align:left">' + T('vWhisper') + '</p>';
      h += '<button class="btn danger" type="button" data-action="verdict-next" style="width:100%">' + T('vBtn') + '</button>';
    } else {
      var c = v.contract, closed = tradesOf(c).filter(function(t){ return t.status === 'closed'; });
      var end = seedOf(c);
      var days = Math.max(1, Math.round((new Date(c.endedAt) - new Date(c.startedAt)) / 86400000));
      var stillOpen = tradesOf(c).filter(function(t){ return t.status === 'open'; }).length;
      h += '<h2>' + T('vBrokenTitle') + '</h2>';
      h += '<p>' + T('vBrokenText') + '</p>';
      h += '<div class="summary"><div><small>' + T('sumDays') + '</small><span>' + T('sumDaysV', { n: days }) + '</span></div><div><small>' + T('sTrades') + '</small><span>' + T('sTradesV', { n: closed.length }) + '</span></div><div><small>' + T('sumStart') + '</small><span>' + usd(c.startSeed) + '</span></div><div><small>' + T('sumEnd') + '</small><span class="' + cls(end - c.startSeed) + '">' + usd(end) + '</span></div></div>';
      h += '<p class="note">' + T('vBrokenNote') + (stillOpen ? T('vCarry', { n: stillOpen }) : '') + '</p>';
      h += '<button class="btn long" type="button" data-action="new-contract" style="width:100%">' + T('vRenew') + '</button>';
    }
    $('verdict').innerHTML = h;
    $('overlay').hidden = false;
    var b = $('verdict').querySelector('button'); if (b) b.focus();
  }

  // ---------- views ----------
  function show(view){
    $('gate').hidden = view !== 'gate';
    $('journal').hidden = view !== 'journal';
    if (view === 'gate') { renderTop(); renderGate(); }
    else { if (!$('t-date').value) $('t-date').value = nowLocal(); renderJournal(); }
    window.scrollTo(0, 0);
  }

  function startDemo(){
    var d = blank();
    var notes = T('demoNotes');
    var now = Date.now(), day = 86400000;
    var iso = function(ms){ var x = new Date(ms); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
    d.contracts.push({ id:1, startSeed:1000, threshold:6, startedAt:new Date(now - 6 * day).toISOString(), endedAt:null, broken:false });
    d.nextId = 2;
    var samples = [
      { sym:'BTCUSDT', entry:79800, stop:79200, exit:81000, lev:20, ago:5.6, nk:0 },
      { sym:'ETHUSDT', entry:3050, stop:3110, exit:3110, lev:10, ago:4.8, nk:1 },
      { sym:'BTCUSDT', entry:80400, stop:80200, exit:78200, lev:30, ago:3.5, nk:2, rk:4 },
      { sym:'SOLUSDT', entry:182, stop:178, exit:190, lev:10, ago:2.2, nk:3 }
    ];
    samples.forEach(function(s){
      var c = d.contracts[0];
      var seed = c.startSeed + d.trades.reduce(function(a, t){ return a + t.pnl; }, 0);
      var z = sizing(seed, 1, s.entry, s.stop, s.lev);
      var t = { id:d.nextId++, contractId:1, date:iso(now - s.ago * day), symbol:s.sym, dir:z.dir, entry:s.entry, stop:s.stop, lev:s.lev, qty:z.qty, riskAmt:z.riskAmt, riskPct:1, seedAtEntry:seed, threshold:6, entrySnap:'', note:notes[s.nk], nk:s.nk, status:'closed' };
      var r = closeCalc(t, s.exit, 0.05, 6);
      t.exit = s.exit; t.closedAt = new Date(now - (s.ago - 0.3) * day).toISOString(); t.pnl = r.pnl; t.fee = r.fee; t.pct = r.pct; t.r = r.r; t.violation = r.violation; t.review = s.rk != null ? notes[s.rk] : ''; if (s.rk != null) t.rk = s.rk; t.exitSnap = '';
      d.trades.push(t);
    });
    var seedNow = 1000 + d.trades.reduce(function(a, t){ return a + t.pnl; }, 0);
    var z = sizing(seedNow, 1, 80150, 79650, 10);
    d.trades.push({ id:d.nextId++, contractId:1, date:iso(now - 0.1 * day), symbol:'BTCUSDT', dir:'long', entry:80150, stop:79650, lev:10, qty:z.qty, riskAmt:z.riskAmt, riskPct:1, seedAtEntry:seedNow, threshold:6, entrySnap:'', note:notes[5], nk:5, status:'open' });
    demo = d;
    show('journal');
  }

  // ---------- settings / backup ----------
  function renderReset(){ $('reset-zone').innerHTML = '<button class="btn ghost small" type="button" data-action="reset-ask">' + T('resetBtn') + '</button>'; }
  function openSettings(){
    $('s-risk').value = S().settings.riskPct; $('s-fee').value = S().settings.feePct;
    $('settings').hidden = false; $('import-confirm').innerHTML = '';
    renderReset();
  }
  function exportText(){ return JSON.stringify(store, null, 1); }
  var pendingImport = null;
  function stageImport(text){
    try {
      var d = JSON.parse(text);
      if (!valid(d)) throw new Error('bad');
      pendingImport = d;
      $('import-confirm').innerHTML = '<div class="confirm"><div>' + T('importConfirm', { c: d.contracts.length, t: d.trades.length }) + '</div><div class="btns"><button class="btn small long" type="button" data-action="import-confirm">' + T('importYes') + '</button><button class="btn small ghost" type="button" data-action="import-cancel">' + T('cancel') + '</button></div></div>';
    } catch (e) {
      pendingImport = null;
      $('import-confirm').innerHTML = '<div class="banner alert">' + esc(T('importBad')) + '</div>';
    }
  }

  var toastTimer;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 2200);
  }

  // ---------- events ----------
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action], [data-lang], #g-enter, #rec-long, #rec-short, #open-settings');
    if (!el) return;
    var id = parseInt(el.getAttribute('data-id'), 10);
    if (el.hasAttribute('data-lang')) return setLang(el.getAttribute('data-lang'));
    if (el.id === 'g-enter') return enterJournal();
    if (el.id === 'rec-long') return recordEntry('long');
    if (el.id === 'rec-short') return recordEntry('short');
    if (el.id === 'open-settings') return openSettings();
    switch (el.getAttribute('data-action')) {
      case 'demo': return startDemo();
      case 'exit-demo': demo = null; gateSigned = false; return show('gate');
      case 'guide': openSettings(); return;
      case 'close-settings': $('settings').hidden = true; if (!$('journal').hidden) renderJournal(); else renderGate(); return;
      case 'close-preview':
        var v = n(($('exit-' + id) || {}).value);
        if (!(v > 0)) { toast(T('tExitReq')); return; }
        pendingClose[id] = v; renderOpen(); return;
      case 'close-cancel': delete pendingClose[id]; renderOpen(); return;
      case 'close-confirm': return confirmClose(id);
      case 'del-ask': pendingCancel[id] = true; renderOpen(); return;
      case 'del-cancel': delete pendingCancel[id]; renderOpen(); return;
      case 'del-confirm':
        S().trades = S().trades.filter(function(t){ return !(t.id === id && t.status === 'open'); });
        delete pendingCancel[id]; save(); renderJournal(); toast(T('tDel')); return;
      case 'verdict-next': return nextVerdict();
      case 'new-contract': $('overlay').hidden = true; queue = []; freshCut = null; gateSigned = false; return show('gate');
      case 'export-copy':
        var txt = exportText();
        try {
          navigator.clipboard.writeText(txt).then(function(){ toast(T('tCopied')); }, function(){ fallbackCopy(txt); });
        } catch (err) { fallbackCopy(txt); }
        return;
      case 'export-file':
        try {
          var blob = new Blob([exportText()], { type:'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'trademon-journal-' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(a); a.click(); a.remove();
          toast(T('tFileStart'));
        } catch (err) { toast(T('tFileBlocked')); }
        return;
      case 'import-text': return stageImport($('s-import-text').value);
      case 'import-cancel': pendingImport = null; $('import-confirm').innerHTML = ''; return;
      case 'import-confirm':
        if (!pendingImport) return;
        store = pendingImport; pendingImport = null; demo = null; save();
        $('import-confirm').innerHTML = ''; $('s-import-text').value = '';
        $('settings').hidden = true; gateSigned = false; show('gate'); toast(T('tImported')); return;
      case 'reset-ask':
        $('reset-zone').innerHTML = '<div class="confirm bad"><div>' + T('resetConfirm') + '</div><div class="btns"><button class="btn small danger" type="button" data-action="reset-confirm">' + T('resetYes') + '</button><button class="btn small ghost" type="button" data-action="reset-cancel">' + T('cancel') + '</button></div></div>';
        return;
      case 'reset-cancel': return renderReset();
      case 'reset-confirm':
        store = blank(); demo = null; save(); $('settings').hidden = true; gateSigned = false; show('gate'); toast(T('tReset')); return;
    }
  });
  function fallbackCopy(txt){
    var ta = $('s-import-text'); ta.value = txt; ta.focus(); ta.select();
    toast(T('tCopyBlocked'));
  }

  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.id === 'g-sign') return;
    if (t.id === 'g-th') { $('g-th-out').textContent = t.value + '%'; var ct = $('clause-th'); if (ct) ct.textContent = t.value + '%'; return; }
    if (['t-entry', 't-stop', 't-lev', 't-symbol'].indexOf(t.id) >= 0) return renderCalc();
    if (t.id === 's-fee') { var f = n(t.value); if (f >= 0 && f <= 1) { S().settings.feePct = f; save(); } return; }
    if (t.id === 's-risk') { var r = n(t.value); if (r > 0 && r <= 5) { S().settings.riskPct = r; save(); } return; }
    var fld = t.getAttribute && t.getAttribute('data-field');
    if (fld) {
      var tr = S().trades.find(function(x){ return x.id === parseInt(t.getAttribute('data-id'), 10); });
      if (tr && tr.status === 'closed') { tr[fld] = t.value; save(); }
    }
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if (t.id === 'g-sign') { gateSigned = t.checked; $('g-enter').disabled = !t.checked; return; }
    if (t.getAttribute && t.getAttribute('data-field') === 'exitSnap') return renderHistory();
    if (t.id === 's-import-file' && t.files && t.files[0]) {
      var rd = new FileReader();
      rd.onload = function(){ stageImport(String(rd.result)); };
      rd.readAsText(t.files[0]);
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !$('settings').hidden) { $('settings').hidden = true; }
  });
  $('settings').addEventListener('click', function(e){ if (e.target === $('settings')) $('settings').hidden = true; });
  document.addEventListener('error', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.closest('.snap')) { var a = t.parentNode; if (a && a.tagName === 'A') a.remove(); else t.remove(); }
  }, true);
